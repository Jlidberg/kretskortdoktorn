server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  client_max_body_size 64m;

  # Inget av repots egna filer ska gå att hämta.
  location ~ /\.            { return 404; }
  location ~ \.md$          { return 404; }
  location ^~ /deploy/      { return 404; }
  location ^~ /mottagare/   { return 404; }

  location = /api/inlamning {
    proxy_pass http://mottagare:3000;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 60s;
  }

  # Besöksstatistik: Umami (samma som mgxtechnology.com). Bara skriptet och insamlingen syns här;
  # adressen till Umami är UMAMI_URL i deploy/.env.
  location = /stats/script.js {
    proxy_pass ${UMAMI_URL}/script.js;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /stats/api/send {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_pass ${UMAMI_URL}/api/send;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location / { try_files $uri $uri/ $uri.html =404; }
}
