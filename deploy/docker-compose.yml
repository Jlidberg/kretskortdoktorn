# Kretskortsdoktorn i CT 103 på destiny. Traefik skickar kretskortsdoktorn.se till 10.10.10.103:8090.
#   cd /opt/kretskortsdoktorn/deploy && docker compose up -d --build
name: kretskortsdoktorn
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      # nginx:alpine fyller i ${UMAMI_URL} i mallen när containern startar.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Umami körs i MGX-sajtens compose (port 3088). Ändra i deploy/.env om den ligger någon annanstans.
      UMAMI_URL: ${UMAMI_URL:-http://host.docker.internal:3088}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mottagare]
  mottagare:
    build: ../mottagare
    restart: unless-stopped
    env_file: .env
